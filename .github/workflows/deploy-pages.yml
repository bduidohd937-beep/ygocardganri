name: 정적 웹앱 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: ART LAB 소스 고정
        uses: actions/checkout@v4
        with:
          repository: bduidohd937-beep/ygoimeagemaker
          ref: bbe322542187a136545597f652a5d8be071e8642
          path: .integration_sources/artlab
      - name: 카드 렌더러 소스 고정 · 오버프레임
        uses: actions/checkout@v4
        with:
          repository: bduidohd937-beep/ygocardmaker
          ref: 71a3cc97fd5e8517b28799fcb437814bb93ab970
          path: .integration_sources/cardmaker
      - name: DESIGN LAB 소스 고정
        uses: actions/checkout@v4
        with:
          repository: bduidohd937-beep/YU-GI-OH-DESIGN-LAB
          ref: 8682b594b331ae4b8922fd5009fa62ee66e1cd7b
          path: .integration_sources/designlab
      - name: PSH 관제실 소스 고정
        uses: actions/checkout@v4
        with:
          repository: bduidohd937-beep/PSH-AI-ARENA
          ref: 1e22f657f4b9be08771953fb686a06f56a8faf9c
          path: .integration_sources/arena
      - name: 통합 모듈 빌드 및 파일 검증
        run: bash scripts/assemble-integration.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
